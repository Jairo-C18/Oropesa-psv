<section id="rutas-en-vivo" class="mx-auto max-w-7xl px-5 py-20 sm:px-8 lg:py-24" aria-labelledby="live-routes-title">
  <div class="mb-9 flex flex-col justify-between gap-4 sm:flex-row sm:items-end">
    <div>
      <p class="flex items-center gap-2 text-xs font-bold uppercase tracking-[0.25em] text-red-400">
        <span class="h-2 w-2 animate-pulse rounded-full bg-red-500" aria-hidden="true"></span>
        Seguimiento en vivo
      </p>
      <h2 id="live-routes-title" class="mt-3 text-3xl font-black text-white sm:text-4xl">Conductores de Oropesa en ruta</h2>
    </div>
    <p class="max-w-lg text-sm leading-6 text-zinc-400">
  </div>
  <div class="grid gap-5 lg:grid-cols-[1.4fr_0.8fr]">
    <div class="relative overflow-hidden rounded-2xl border border-white/10 bg-[#111216]">
      <div id="live-map" role="region" aria-label="Mapa con trabajos activos de Oropesa"></div>
      <aside id="live-player-card" aria-label="Información del trabajo seleccionado" hidden>
        <div class="flex items-center justify-between px-4 pt-3">
          <p class="flex items-center gap-2 text-[10px] font-black uppercase tracking-[0.18em] text-emerald-400">
            <span class="h-2 w-2 animate-pulse rounded-full bg-emerald-400" aria-hidden="true"></span>
            Ruta activa
          </p>
          <button
            id="live-player-close"
            class="rounded-lg border border-white/10 px-2 py-1 text-xs text-zinc-400 transition hover:bg-white/10 hover:text-white"
            type="button"
            aria-label="Cerrar información del trabajo"
          >×</button>
        </div>
        <div class="flex items-center gap-3 px-4 py-3">
          <img id="live-player-avatar" alt="" />
          <div class="min-w-0">
            <p id="live-player-name" class="truncate text-sm font-extrabold text-white"></p>
            <p id="live-player-vehicle" class="mt-1 truncate text-[11px] text-zinc-400"></p>
          </div>
        </div>
        <div id="live-player-stats" class="mx-4 grid grid-cols-2 gap-3 rounded-xl border border-white/5 bg-white/[0.04] p-3">
          <div>
            <p id="live-player-speed" class="text-lg font-black text-white"></p>
            <p class="text-[10px] text-zinc-500">Carga</p>
          </div>
          <div>
            <p id="live-player-vehicle-type" class="text-lg font-black text-white"></p>
            <p class="text-[10px] text-zinc-500">Vehículo estimado</p>
          </div>
        </div>
        <div class="px-4 pt-2">
          <div class="live-player-fact"><span>Ubicación</span><strong id="live-player-state"></strong></div>
          <div class="live-player-fact"><span>Distancia planeada</span><strong id="live-player-distance"></strong></div>
        </div>
        <a
          id="live-player-profile"
          class="m-4 flex items-center justify-center gap-2 rounded-xl bg-[#E61C1C] px-4 py-3 text-xs font-extrabold text-white transition hover:bg-red-600"
          target="_blank"
          rel="noopener noreferrer"
        >Ver perfil Trucky <span aria-hidden="true">→</span></a>
      </aside>
    </div>
    <div class="flex min-h-[320px] flex-col overflow-hidden rounded-2xl border border-white/10 bg-[#121317] shadow-2xl shadow-black/20">
      <div class="flex items-center justify-between border-b border-white/10 px-5 py-4">
        <div>
          <p class="text-[10px] font-bold uppercase tracking-[0.2em] text-red-400">Ahora mismo</p>
          <h3 class="mt-1 font-bold text-white">En ruta</h3>
        </div>
        <span id="live-routes-count" class="rounded-full border border-red-500/20 bg-red-500/10 px-3 py-1 text-xs font-black text-red-400">0</span>
      </div>
      <ol id="live-routes-list" class="max-h-[520px] flex-1 divide-y divide-white/10 overflow-y-auto">
        <li id="live-routes-placeholder" class="px-5 py-6 text-sm text-zinc-400">Buscando trabajos activos de Oropesa en Trucky...</li>
      </ol>
      <p id="live-routes-status" class="border-b border-t border-white/10 px-5 py-3 text-xs text-zinc-500" role="status" aria-live="polite">
        Conectando con el mapa en vivo...
      </p>
    </div>
  </div>
</section>
</body>
