<section id="ranking" class="border-b border-white/10 bg-white/[0.025] py-16" aria-labelledby="ranking-title">
  <div class="mx-auto max-w-7xl px-5 sm:px-8">
    <div class="rounded-2xl border border-white/10 bg-[#111216] p-6 shadow-xl shadow-black/20 sm:p-8 lg:p-10">
      <div class="grid gap-8 lg:grid-cols-[280px_1fr] xl:grid-cols-[340px_1fr]">
        <div class="flex flex-col justify-center border-b border-white/10 pb-8 lg:border-b-0 lg:border-r lg:pb-0 lg:pr-10">
          <div class="mb-4 inline-flex items-center gap-2 self-start rounded-full border border-red-500/20 bg-red-500/10 px-3 py-1.5 text-[10px] font-black uppercase tracking-[0.25em] text-red-400">
            <span class="h-1.5 w-1.5 rounded-full bg-red-500 shadow-[0_0_8px_rgba(239,68,68,0.8)]"></span>
            El Salón de la Fama
          </div>
          <h2 id="ranking-title" class="text-4xl font-black leading-[1.1] tracking-tight sm:text-5xl lg:text-4xl xl:text-5xl">
            <span class="bg-gradient-to-br from-white via-zinc-200 to-zinc-500 bg-clip-text text-transparent">Top ruteros</span>
            <br class="hidden lg:block">
            <span class="text-white">de la empresa</span>
          </h2>
          <div class="relative mt-7 pl-5">
            <div class="absolute bottom-1 left-0 top-1 w-0.5 rounded-full bg-gradient-to-b from-red-500 to-transparent"></div>
            <p class="font-serif text-lg italic text-zinc-300">
              Los kilómetros recorridos este mes y el total acumulado.
            </p>
            <p id="ranking-status" class="mt-3 font-serif text-sm italic text-zinc-500" role="status" aria-live="polite">
              Cargando trabajos completados de la empresa...
            </p>
          </div>
        </div>
        <div>
          <div class="mb-5 flex gap-2" role="group" aria-label="Periodo del ranking">
            <button
              id="ranking-month-tab"
              class="rounded-lg border border-red-500 bg-red-500/15 px-4 py-2 text-xs font-black uppercase tracking-wider text-red-300 transition"
              type="button"
              aria-pressed="true"
              data-ranking-period="month"
            >
              Este mes
            </button>
            <button
              id="ranking-total-tab"
              class="rounded-lg border border-white/10 bg-white/[0.03] px-4 py-2 text-xs font-black uppercase tracking-wider text-zinc-400 transition hover:text-white"
              type="button"
              aria-pressed="false"
              data-ranking-period="total"
            >
              Acumulado
            </button>
          </div>
          <ol id="ranking-list" class="flex flex-col gap-4" aria-label="Conductores con mayor distancia recorrida este mes">
            <li id="ranking-placeholder" class="flex items-center justify-center rounded-xl border border-white/5 bg-white/[0.02] px-5 py-12 text-center font-serif text-sm italic text-zinc-500">
              Cargando ranking de conductores...
            </li>
          </ol>
          <button
            id="ranking-more"
            class="mx-auto mt-5 rounded-lg border border-white/10 bg-white/[0.03] px-5 py-2.5 text-xs font-black uppercase tracking-wider text-zinc-300 transition hover:border-red-500/50 hover:text-white"
            type="button"
            aria-expanded="false"
            aria-controls="ranking-list"
            hidden
          >
            Ver más
          </button>
        </div>
      </div>
    </div>
  </div>
</section>
</body>
