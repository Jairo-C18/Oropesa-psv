<section id="rutas" class="relative mx-auto max-w-7xl px-5 py-20 sm:px-8 lg:py-24" aria-labelledby="routes-title">
  
  <!-- Destello ambiental de fondo (sutil) -->
  <div class="absolute -right-20 top-10 -z-10 h-72 w-72 rounded-full bg-red-600/5 blur-[100px]" aria-hidden="true"></div>

  <!-- ENCABEZADO DE RUTAS -->
  <div class="mb-10 flex flex-col justify-between gap-6 sm:flex-row sm:items-end">
    <div>
      <div class="mb-3 inline-flex items-center gap-2 rounded-full border border-red-500/20 bg-red-500/10 px-3 py-1 text-[10px] font-black uppercase tracking-[0.25em] text-red-400">
        <span class="h-1.5 w-1.5 rounded-full bg-red-500 shadow-[0_0_8px_rgba(239,68,68,0.8)] animate-pulse" aria-hidden="true"></span>
        Actividad de la empresa
      </div>
      <h2 id="routes-title" class="mt-3 text-4xl font-black tracking-tight sm:text-5xl">
        Rutas <span class="bg-gradient-to-r from-red-500 to-red-400 bg-clip-text text-transparent">completadas</span>
      </h2>
    </div>
    <p class="max-w-lg text-sm font-medium leading-relaxed text-zinc-500 sm:text-right">
      Últimos trabajos y trayectos registrados de la empresa.
    </p>
  </div>

  <!-- CONTENEDOR DE LA TABLA (Diseño Glassmorphism) -->
  <div class="group relative overflow-hidden rounded-2xl border border-white/10 bg-[#111216] shadow-xl shadow-black/20 transition-all duration-500 hover:border-red-500/30 hover:shadow-[0_12px_40px_rgba(230,28,28,0.1)]">
    
    <!-- Línea decorativa superior que aparece al hacer hover -->
    <div class="absolute inset-x-0 top-0 h-0.5 bg-gradient-to-r from-transparent via-red-500/50 to-transparent opacity-0 transition-opacity duration-500 group-hover:opacity-100"></div>

    <!-- Cabecera de la tabla -->
    <div class="grid grid-cols-[1fr_auto] gap-4 border-b border-white/10 bg-gradient-to-r from-white/[0.04] to-transparent px-5 py-5 text-xs font-bold uppercase tracking-[0.2em] text-zinc-400 sm:grid-cols-[1.4fr_1fr_auto] sm:px-8">
      <span>Trayecto</span>
      <span class="hidden sm:block">Conductor</span>
      <span class="text-right">Distancia</span>
    </div>
    
    <!-- Lista dinámica de rutas -->
    <ol id="routes-list" class="divide-y divide-white/5 bg-white/[0.01]">
      <li id="routes-placeholder" class="flex items-center justify-center px-5 py-16 text-sm font-medium italic text-zinc-500 sm:px-8">
        <!-- Ícono de carga integrado -->
        <svg class="mr-3 h-5 w-5 animate-spin text-red-500/80" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
        Buscando rutas recientes en Trucky...
      </li>
    </ol>
    
  </div>
</section>
</body>
